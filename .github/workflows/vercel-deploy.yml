name: Deploy to Vercel

# Links (or creates) the Vercel project, sets the Supabase variables from the repo's .env
# for Production, and publishes a production deployment.
#
# Needs the secret VERCEL_TOKEN (https://vercel.com/account/tokens), stored either in the
# GitHub environment "SUPABASE_ACCESS_TOKEN" or as a repository secret.
# Optional repository variable VERCEL_SCOPE: the Vercel team slug, if the project lives in a team.

on:
  workflow_dispatch:
  push:
    branches: [claude/practical-hawking-njk7qq]
    paths:
      - '.github/workflows/vercel-deploy.yml'

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SUPABASE_ACCESS_TOKEN
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      PROJECT_NAME: snug-salary-safe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is empty. Store it in the GitHub environment SUPABASE_ACCESS_TOKEN (Settings > Environments) or as a repository secret."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link project
        run: |
          SCOPE_ARGS=""
          if [ -n "$VERCEL_SCOPE" ]; then SCOPE_ARGS="--scope $VERCEL_SCOPE"; fi
          echo "SCOPE_ARGS=$SCOPE_ARGS" >> "$GITHUB_ENV"
          if ! vercel link --yes --project "$PROJECT_NAME" --token "$VERCEL_TOKEN" $SCOPE_ARGS; then
            echo "Project $PROJECT_NAME not found; creating it."
            vercel project add "$PROJECT_NAME" --token "$VERCEL_TOKEN" $SCOPE_ARGS
            vercel link --yes --project "$PROJECT_NAME" --token "$VERCEL_TOKEN" $SCOPE_ARGS
          fi

      - name: Set Supabase variables for Production
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            value=$(grep -E "^${name}=" .env | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
            if [ -z "$value" ]; then echo "::error::$name missing from .env"; exit 1; fi
            vercel env rm "$name" production --yes --token "$VERCEL_TOKEN" $SCOPE_ARGS >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" production --token "$VERCEL_TOKEN" $SCOPE_ARGS
            echo "Set $name"
          done

      - name: Deploy to production
        run: |
          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" $SCOPE_ARGS)
          echo "Production deployment: $url"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
