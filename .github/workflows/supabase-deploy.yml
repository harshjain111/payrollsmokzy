name: Deploy Supabase edge functions

# Deploys every function in supabase/functions to the Supabase project and syncs function
# secrets that are stored as GitHub repository secrets.
#
# One-time setup: add the secret SUPABASE_ACCESS_TOKEN to the GitHub environment
# "SUPABASE_ACCESS_TOKEN" (or as a repository secret)
# (create it at https://supabase.com/dashboard/account/tokens).
# Optional: add any of the function secrets listed in SECRET_NAMES below as repository
# secrets; the ones that exist are pushed to Supabase on every run.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/practical-hawking-njk7qq]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets live in the GitHub environment named "SUPABASE_ACCESS_TOKEN"
    # (Settings > Environments). Repository secrets with the same names also work.
    environment: SUPABASE_ACCESS_TOKEN
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jotpsrmsauypyycdkbhp
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Sync function secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WABANOW_API_KEY: ${{ secrets.WABANOW_API_KEY }}
          JUVLON_API_KEY: ${{ secrets.JUVLON_API_KEY }}
          FINANCIAL_CORE_WEBHOOK_URL: ${{ secrets.FINANCIAL_CORE_WEBHOOK_URL }}
          SMOKZY_ORDER_WEBHOOK_SECRET: ${{ secrets.SMOKZY_ORDER_WEBHOOK_SECRET }}
          REIMBURSEMENT_WEBHOOK_SECRET: ${{ secrets.REIMBURSEMENT_WEBHOOK_SECRET }}
        run: |
          SECRET_NAMES="TELEGRAM_BOT_TOKEN TELEGRAM_OWNER_CHAT_ID AI_API_KEY AI_BASE_URL AI_MODEL WHATSAPP_ACCESS_TOKEN WABANOW_API_KEY JUVLON_API_KEY FINANCIAL_CORE_WEBHOOK_URL SMOKZY_ORDER_WEBHOOK_SECRET REIMBURSEMENT_WEBHOOK_SECRET"
          file="$RUNNER_TEMP/function-secrets.env"
          : > "$file"
          for name in $SECRET_NAMES; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> "$file"; fi
          done
          if [ -s "$file" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "$file"
            echo "Synced: $(cut -d= -f1 "$file" | tr '\n' ' ')"
          else
            echo "No function secrets stored in GitHub; skipping."
          fi
          rm -f "$file"

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
